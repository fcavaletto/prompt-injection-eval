name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,notebook]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Tests
        run: python -m pytest
      - name: Mypy
        run: python -m mypy src
      - name: Execute walkthrough notebook
        run: python -m jupyter nbconvert --execute --to notebook --stdout notebooks/01_walkthrough.ipynb > /dev/null
        env:
          PIE_LIVE: "0"

  pilot:
    # The serialization pilot's offline tests need the pinned AgentDojo release, which the
    # main job does not install. Kept separate so its dependencies cannot break that job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the pilot extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,pilot]"
      - name: Pilot tests
        run: python -m pytest tests/test_pilot.py tests/test_pilot_analysis.py tests/test_pilot_exploratory.py tests/test_pilot_serialize.py tests/test_wp7.py tests/test_pilot_supplementary.py tests/test_checker_contract.py tests/test_stage1.py --no-cov
