[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-eval"
version = "0.6.0"
description = "Local evaluation harness for indirect prompt injection in open-weight language models."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Federico Cavaletto" }]
keywords = ["prompt-injection", "llm", "evaluation", "ai-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "pydantic>=2.6",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://fcavaletto.github.io/prompt-injection-eval/"
Repository = "https://github.com/fcavaletto/prompt-injection-eval"

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
mlx = [
  "mlx>=0.29",
  "mlx-lm>=0.28",
]
notebook = [
  "jupyter>=1.1",
  "nbconvert>=7.16",
  "nbformat>=5.10",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocs-jupyter>=0.25",
]
# The serialization pilot. Pinned: the harness checks the installed version before it runs.
pilot = [
  "agentdojo==0.1.35",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.scripts]
pie = "prompt_injection_eval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Archived scripts are kept exactly as they were run.
extend-exclude = ["results-published"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/prompt_injection_eval/cli.py" = ["B008"]
"src/prompt_injection_eval/adaptive/cli.py" = ["B008"]
"src/prompt_injection_eval/injecagent_cli.py" = ["B008"]
# Report sentences and command messages are kept on one line each.
"src/prompt_injection_eval/pilot/cli.py" = ["B008", "E501"]
"src/prompt_injection_eval/pilot/analysis.py" = ["E501"]
"src/prompt_injection_eval/pilot/stage1_cli.py" = ["B008", "E501"]
"src/prompt_injection_eval/pilot/screen_cli.py" = ["B008", "E501"]
"src/prompt_injection_eval/pilot/screen.py" = ["E501"]
"src/prompt_injection_eval/providers/openrouter.py" = ["E501"]
"src/prompt_injection_eval/pilot/stage1_analysis.py" = ["E501"]
# Audit notes are long strings recorded verbatim in audit.json.
"scripts/wp7_audit.py" = ["E501"]
"scripts/wp7_agentdojo_traces.py" = ["E501"]
"scripts/pilot_rescore.py" = ["E501"]
"scripts/cost_screen.py" = ["E501"]
"scripts/build_review_packet.py" = ["E501"]
"scripts/pilot_corrected_c25.py" = ["E501"]
"scripts/pilot_attacker_payments.py" = ["E501"]
"tests/test_stage1_analysis.py" = ["E501"]
"tests/test_openrouter.py" = ["E501"]
"notebooks/*.ipynb" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=prompt_injection_eval --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["prompt_injection_eval"]

[tool.mypy]
python_version = "3.12"
packages = ["prompt_injection_eval"]
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pandas", "matplotlib", "matplotlib.pyplot", "mlx", "mlx.*", "mlx_lm", "mlx_lm.*", "huggingface_hub", "agentdojo", "agentdojo.*", "yaml", "transformers"]
ignore_missing_imports = true
